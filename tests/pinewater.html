<!doctype html><html lang="en"><meta charset="utf-8"><title>Pinewater visual checks</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","rounded-box":"/node_modules/three/examples/jsm/geometries/RoundedBoxGeometry.js","cannon-es":"/node_modules/cannon-es/dist/cannon-es.js"}}</script>
<style>body{margin:0;background:#eef0df;font:14px system-ui}header{padding:10px;display:flex;gap:8px}button{padding:8px}#view{height:calc(100vh - 60px)}canvas{width:100%;height:100%;display:block}</style>
<header id="locations"></header><div id="view"><canvas id="scene"></canvas></div>
<script type="module">
import {createWorld} from '../src/world.js';
import {createCar,respawnCar} from '../src/physics.js';
import {ROAD_POINTS,SPAWN,CLIFF_START,BRIDGE_START,TRAFFIC_START,FORK_START,DEAD_END} from '../src/pinewater.js';
const world=createWorld(document.getElementById('scene')),car=createCar({obstacles:world.obstacles});
const places={'Forest':SPAWN,'First fork':{x:-182,y:64,z:17,yaw:.13},'Tunnel':{...ROAD_POINTS.find(p=>p.section==='tunnel'&&p.x>-90),yaw:Math.PI/2},'Lake reveal':CLIFF_START,'Blind fork':{x:530,y:32,z:-87,yaw:.7},'Turnaround':{...DEAD_END.at(-10),yaw:-.8},'Lower shore':TRAFFIC_START,'Shore fork':{x:290,y:5,z:-505,yaw:Math.PI/2},'Island bridge':BRIDGE_START};
places['Upper glance']={x:455,y:38,z:-15,yaw:-.17};
places['Second tunnel']={x:607,y:22,z:76,yaw:-1.4};
for(const [name,pose] of Object.entries(places)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{respawnCar(car,pose);world.snapCamera();};document.getElementById('locations').append(b);}
respawnCar(car,SPAWN);let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;world.render(car,dt,now/1000,0,18);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
